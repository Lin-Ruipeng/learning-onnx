name: Modern ONNX Course

on:
  push:
    paths:
      - "modern-onnx-course/**"
      - ".github/workflows/modern-onnx-course.yml"
  pull_request:
    paths:
      - "modern-onnx-course/**"
      - ".github/workflows/modern-onnx-course.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-baseline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modern-onnx-course
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: modern-onnx-course/uv.lock

      - name: Rebuild locked environment
        run: uv sync --locked --all-groups

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Validate course state
        run: uv run python tools/check_course_state.py

      - name: Test CPU baseline
        run: uv run pytest

      - name: Run end-to-end smoke test
        run: >-
          uv run python core/ch00_course_protocol/src/verify_environment.py
          --output core/ch00_course_protocol/artifacts/generated/ci-smoke.onnx
