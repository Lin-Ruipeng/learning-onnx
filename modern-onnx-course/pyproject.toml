[project]
name = "modern-onnx-course"
version = "0.1.0"
description = "Executable course for modern PyTorch-to-ONNX export, validation, graph engineering, and deployment"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.4,<3",
    "onnx>=1.23.2,<2",
    "onnxruntime>=1.31.1,<2",
    "onnxscript>=0.7.2,<1",
    "torch>=2.15.0,<2.16",
]

[dependency-groups]
dev = [
    "hypothesis>=6.140",
    "pytest>=9.0",
    "ruff>=0.14",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.pytest.ini_options]
testpaths = ["core"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
